<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SIZOKUTHOLA - Staff Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- ================= BABY PINK THEME ================= -->
    <style>
      :root{
        --pink-bg:        #FFF5F8;
        --pink-panel:     #FCE0E8;
        --pink-panel-alt: #F7D0DC;
        --pink-border:    #F0BCCB;
        --pink-text:      #4A2C35;
        --pink-muted:     #9B7A83;
        --pink-accent:    #D4849B;
        --pink-accent-hv: #BF6E86;
        --pink-deep:      #8B4A5C;
      }
      body, .login-body{
        background: linear-gradient(135deg, #FFF0F3 0%, #FBDCE4 100%) !important;
        color: var(--pink-text);
      }
      .login-card{
        background: var(--pink-panel) !important;
        border: 1px solid var(--pink-border);
        border-radius: 16px;
      }
      .system-name{ color: var(--pink-deep) !important; }
      .login-card h2{ color: var(--pink-text) !important; }
      .login-card label{ color: var(--pink-muted); }
      .text-muted{ color: var(--pink-muted) !important; }
      .input-group-text{
        background: var(--pink-panel-alt);
        border-color: var(--pink-border);
        color: var(--pink-accent);
      }
      .form-control{
        background: var(--pink-panel-alt);
        border-color: var(--pink-border);
        color: var(--pink-text);
      }
      .form-control:focus{
        border-color: var(--pink-accent);
        box-shadow: 0 0 0 .2rem rgba(212,132,155,.22);
        background: #fff;
      }
      .btn-primary{
        background-color: var(--pink-accent) !important;
        border-color: var(--pink-accent) !important;
        color: #fff !important;
      }
      .btn-primary:hover{
        background-color: var(--pink-accent-hv) !important;
        border-color: var(--pink-accent-hv) !important;
      }
      .alert-danger{
        background: #FDEDF2; border-color:#F5C6D6; color:#8B2447;
      }
    </style>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="login-body">

<div class="login-container">

    <div class="login-card shadow-lg">

        <div class="text-center">

            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                class="login-logo">

            <h2 class="mt-3">

                Staff / SOC Login

            </h2>

            <h1 class="system-name" style="font-size:1.6rem;">

                SIZOKUTHOLA

            </h1>

            <p class="text-muted">

                For Administrators and Security Analysts

            </p>

        </div>

        <form method="POST">

            <div class="mb-3">

                <label>

                    Username

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fas fa-user"></i>

                    </span>

                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        placeholder="e.g. admin"
                        required>

                </div>

            </div>

            <div class="mb-4">

                <label>

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fas fa-lock"></i>

                    </span>

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        required>

                </div>

            </div>

            <button
                class="btn btn-primary w-100">

                <i class="fas fa-right-to-bracket"></i>

                Login as Staff

            </button>

        </form>

        {% if error %}

        <div class="alert alert-danger mt-4">

            {{ error }}

        </div>

        {% endif %}

        <p class="text-center mt-4 mb-0">
            <a href="{{ url_for('login') }}" class="text-muted" style="font-size:.85rem;">
                <i class="fa-solid fa-arrow-left"></i> Not staff? Go back
            </a>
        </p>

    </div>

</div>

</body>

</html>
