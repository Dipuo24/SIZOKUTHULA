<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SIZOKUTHOLA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        .portal-choice{
            display:flex; gap:16px; margin-top:26px; flex-wrap:wrap;
        }
        .portal-card{
            flex:1; min-width:200px; border:1px solid #F0BCCB; border-radius:14px;
            padding:24px 20px; text-align:center; text-decoration:none; color:#4A2C35;
            transition: all .15s ease; background:#FCE0E8;
        }
        .portal-card:hover{
            border-color:#D4849B; box-shadow:0 4px 14px rgba(212,132,155,.28); color:#4A2C35;
            transform: translateY(-2px);
        }
        .portal-card i{ font-size:2rem; color:#D4849B; margin-bottom:12px; display:block; }
        .portal-card h5{ margin:0 0 6px; font-weight:700; }
        .portal-card p{ margin:0; color:#9B7A83; font-size:.82rem; }
    </style>

</head>

<body class="login-body">

<div class="login-container">

    <div class="login-card shadow-lg" style="max-width:520px;">

        <div class="text-center">

            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                class="login-logo">

            <h2 class="mt-3">

                Welcome to

            </h2>

            <h1 class="system-name">

                SIZOKUTHOLA

            </h1>

            <p class="text-muted">

                AI-Powered Insider Threat Detection System

            </p>

        </div>

        <p class="text-center text-muted" style="font-size:.9rem;">
            Choose how you're signing in
        </p>

        <div class="portal-choice">

            <a href="{{ url_for('staff_login') }}" class="portal-card">
                <i class="fa-solid fa-shield-halved"></i>
                <h5>Staff / SOC</h5>
                <p>Administrators and Security Analysts monitoring the system.</p>
            </a>

            <a href="{{ url_for('employee_login') }}" class="portal-card">
                <i class="fa-solid fa-id-badge"></i>
                <h5>Employee</h5>
                <p>Data Capturers, ICT Administrators, Printing Technicians, Examination Officers, and more.</p>
            </a>

        </div>

    </div>

</div>

</body>

</html>
