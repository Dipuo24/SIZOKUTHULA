<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System Error - SIZOKUTHOLA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            background: #FFF5F8;
            font-family: 'Inter', -apple-system, Segoe UI, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .err-card {
            background: #FCE0E8; border: 1px solid #F0BCCB; border-radius: 16px;
            padding: 48px 56px; text-align: center; max-width: 520px;
            border-top: 4px solid #C2185B;
        }
        .err-code { font-size: 4rem; font-weight: 700; color: #C2185B; line-height: 1; }
        .err-title { font-size: 1.3rem; font-weight: 600; color: #4A2C35; margin-top: 12px; }
        .err-text { color: #9B7A83; margin-top: 10px; font-size: .95rem; }
        .btn-home {
            background: #D4849B; color: #fff; border: none; border-radius: 9px;
            padding: 10px 22px; font-weight: 600; margin-top: 22px; text-decoration: none;
            display: inline-block;
        }
        .btn-home:hover { background: #BF6E86; color: #fff; }
    </style>
</head>
<body>
    <div class="err-card">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:2.4rem; color:#C2185B;"></i>
        <div class="err-code">500</div>
        <div class="err-title">Something went wrong on our side</div>
        <p class="err-text">
            SIZOKUTHOLA hit an unexpected error while processing that request.
            Monitoring is still running in the background &mdash; please try again,
            or contact your system administrator if this keeps happening.
        </p>
        <a href="/" class="btn-home">
            <i class="fa-solid fa-arrow-left"></i> Back to SIZOKUTHOLA
        </a>
    </div>
</body>
</html>
